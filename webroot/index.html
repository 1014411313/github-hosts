<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GitHub Hosts 加速</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:12px 12px calc(28px + env(safe-area-inset-bottom));background:#0f1115;color:#e6e8ee;
  font:14px/1.6 -apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif}
h1{font-size:17px;margin:4px 0 14px}
.card{background:#171a21;border:1px solid #232733;border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:600;color:#8b93a7;margin:0 0 10px;letter-spacing:.3px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #21252f}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.name{font-weight:600}
.url{font-size:12px;color:#79819a;word-break:break-all}
.desc{font-size:12px;color:#5f6678;margin-top:2px}
button{font:inherit;border:0;border-radius:9px;padding:10px 16px;background:#2f6fed;color:#fff;font-weight:600}
button.ghost{background:#232733;color:#c7ccdb}
button.danger{background:transparent;color:#e0605e;padding:8px 10px}
button:disabled{opacity:.5}
.btns{display:flex;gap:10px}
.btns button{flex:1}
input{font:inherit;width:100%;padding:10px;border-radius:9px;border:1px solid #2b303c;background:#0f1115;color:#e6e8ee}
input+button{margin-top:10px}
label.f{display:block;font-size:12px;color:#8b93a7;margin:10px 0 5px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:#333a48;border-radius:13px;transition:.15s}
.sw i:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+i{background:#2f6fed}
.sw input:checked+i:after{transform:translateX(18px)}
pre{background:#0b0d11;border:1px solid #21252f;border-radius:9px;padding:10px;margin:0;font-size:12px;
  max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.kv span:first-child{color:#8b93a7}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:#232733;color:#8b93a7}
.tag.ok{background:#123524;color:#4ec97e}
.tag.bad{background:#3a1c1c;color:#e0605e}
.muted{color:#79819a;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>GitHub Hosts 加速</h1>

<div class="card">
  <h2>状态</h2>
  <div class="kv"><span>最后更新</span><b id="stTime">—</b></div>
  <div class="kv"><span>hosts 条目</span><b id="stCount">—</b></div>
  <div class="kv"><span>github.com</span><b id="stNet"><span class="tag">未测</span></b></div>
  <div class="btns" style="margin-top:12px">
    <button id="btnUpdate">立即更新</button>
    <button id="btnTest" class="ghost">测试连通性</button>
  </div>
  <div class="muted" id="out"></div>
</div>

<div class="card">
  <h2>源（多源合并去重）</h2>
  <div id="srcList"></div>
</div>

<div class="card">
  <h2>添加源</h2>
  <label class="f">名称</label>
  <input id="newName" placeholder="例如 我的源">
  <label class="f">URL（hosts 格式）</label>
  <input id="newUrl" placeholder="https://...">
  <button id="btnAdd">添加</button>
</div>

<div class="card">
  <h2>设置</h2>
  <label class="f">自动更新间隔（小时）</label>
  <input id="interval" type="number" min="1" step="1" value="12">
  <button id="btnSave">保存</button>
  <div class="muted">修改间隔后需重启生效。</div>
</div>

<div class="card">
  <h2>日志</h2>
  <pre id="log">加载中…</pre>
  <button id="btnReloadLog" class="ghost" style="margin-top:10px">刷新日志</button>
</div>

<script>
const MOD = '/data/adb/modules/github_hosts';
const DATA = '/data/adb/github_hosts';
const F_SOURCES = DATA + '/sources.json';
const F_DISABLED = DATA + '/disabled.list';
const F_CONF = DATA + '/config.conf';
const F_LOG = DATA + '/log.txt';
const F_HOSTS = MOD + '/system/etc/hosts';

const $ = (id) => document.getElementById(id);

function exec(cmd) {
  return new Promise((resolve, reject) => {
    if (typeof ksu === 'undefined' || !ksu.exec) {
      reject(new Error('请在 KernelSU 管理器的 WebUI 中打开本页面'));
      return;
    }
    let settled = false;
    const done = (out) => { if (!settled) { settled = true; resolve(out || ''); } };

    // KernelSU 注入的 API 为回调风格：ksu.exec(cmd, optionsJson, callbackName)
    const cbName = '__ksu_cb_' + Math.random().toString(36).slice(2);
    window[cbName] = (errno, stdout) => { delete window[cbName]; done(stdout); };

    let ret = null;
    try { ret = ksu.exec(cmd, '{}', cbName); } catch (e) { ret = null; }

    if (ret && typeof ret.then === 'function') {
      delete window[cbName];
      ret.then((r) => done(r && r.stdout)).catch(reject);
    } else if (typeof ret === 'string') {
      delete window[cbName];
      done(ret);
    }
  });
}

function b64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

const readText = (p) => exec("cat '" + p + "' 2>/dev/null");
const writeText = (p, s) => exec("printf %s '" + b64(s) + "' | base64 -d > '" + p + "'");

let sources = [];
let disabled = new Set();

function toast(msg) { $('out').textContent = msg; }

async function loadStatus() {
  const hosts = await readText(F_HOSTS);
  const lines = hosts.split('\n').filter((l) => l.trim() && !l.startsWith('#'));
  $('stCount').textContent = lines.length;

  const first = hosts.split('\n')[0] || '';
  const m = first.match(/生成于 (.+)$/);
  $('stTime').textContent = m ? m[1] : '—';
}

async function loadSources() {
  try {
    sources = JSON.parse((await readText(F_SOURCES)) || '[]');
  } catch (e) {
    sources = [];
  }
  const raw = await readText(F_DISABLED);
  disabled = new Set(raw.split('\n').map((s) => s.trim()).filter(Boolean));
  renderSources();
}

function renderSources() {
  const box = $('srcList');
  box.textContent = '';
  if (!sources.length) {
    box.innerHTML = '<div class="muted">没有启用任何源，请添加。</div>';
    return;
  }
  sources.forEach((src, idx) => {
    const row = document.createElement('div');
    row.className = 'row';

    const grow = document.createElement('div');
    grow.className = 'grow';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = src.name || '未命名';
    const url = document.createElement('div');
    url.className = 'url';
    url.textContent = src.url || '';
    grow.append(name, url);
    if (src.desc) {
      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = src.desc;
      grow.append(desc);
    }

    const sw = document.createElement('label');
    sw.className = 'sw';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !disabled.has(src.url);
    cb.addEventListener('change', () => toggleSource(src.url, cb.checked));
    const knob = document.createElement('i');
    sw.append(cb, knob);

    const del = document.createElement('button');
    del.className = 'danger';
    del.textContent = '删除';
    del.addEventListener('click', () => removeSource(idx));

    row.append(grow, sw, del);
    box.append(row);
  });
}

async function toggleSource(url, enabled) {
  if (enabled) disabled.delete(url);
  else disabled.add(url);
  await writeText(F_DISABLED, [...disabled].join('\n') + (disabled.size ? '\n' : ''));
}

async function saveSources() {
  await writeText(F_SOURCES, JSON.stringify(sources, null, 2) + '\n');
}

async function removeSource(idx) {
  sources.splice(idx, 1);
  await saveSources();
  await loadSources();
}

async function addSource() {
  const name = $('newName').value.trim();
  const url = $('newUrl').value.trim();
  if (!/^https?:\/\//.test(url)) { toast('URL 必须以 http(s):// 开头'); return; }
  sources.push({ name: name || url, url });
  await saveSources();
  $('newName').value = '';
  $('newUrl').value = '';
  await loadSources();
  toast('已添加，点「立即更新」生效');
}

async function doUpdate() {
  $('btnUpdate').disabled = true;
  toast('更新中…');
  try {
    const r = await exec("sh '" + MOD + "/update.sh'");
    toast(r.trim() || '完成（无输出）');
  } catch (e) {
    toast('失败：' + e.message);
  }
  $('btnUpdate').disabled = false;
  await loadStatus();
  await loadLog();
}

async function testNet() {
  const tag = $('stNet');
  tag.innerHTML = '<span class="tag">测试中</span>';
  try {
    const r = (await exec("sh '" + MOD + "/update.sh' --test")).trim();
    tag.innerHTML = r === 'OK'
      ? '<span class="tag ok">可达</span>'
      : '<span class="tag bad">不可达</span>';
  } catch (e) {
    tag.innerHTML = '<span class="tag bad">失败</span>';
  }
}

async function loadLog() {
  const log = await readText(F_LOG);
  const el = $('log');
  el.textContent = log.trim() || '暂无日志';
  el.scrollTop = el.scrollHeight;
}

async function loadConfig() {
  const conf = await readText(F_CONF);
  const m = conf.match(/INTERVAL=(\d+)/);
  $('interval').value = m ? Math.max(1, Math.round(Number(m[1]) / 3600)) : 12;
}

async function saveConfig() {
  const h = Math.max(1, parseInt($('interval').value, 10) || 12);
  await writeText(F_CONF, 'INTERVAL=' + h * 3600 + '\n');
  toast('已保存，重启后生效');
}

async function init() {
  try {
    await loadSources();
    await loadStatus();
    await loadConfig();
    await loadLog();
  } catch (e) {
    toast(e.message);
  }
}

$('btnUpdate').addEventListener('click', doUpdate);
$('btnTest').addEventListener('click', testNet);
$('btnAdd').addEventListener('click', addSource);
$('btnSave').addEventListener('click', saveConfig);
$('btnReloadLog').addEventListener('click', loadLog);

init();
</script>
</body>
</html>
